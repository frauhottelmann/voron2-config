[menu __main prep]
name: Prep
icon: main

[menu __main prep qgl]
name: conditional QGL
icon: z-tilt
method: printer.gcode.script
params: {"script":"CQGL"}

[menu __main prep loadandbrush]
name: Hot Load and Brush
icon: filament
method: printer.gcode.script
params: {"script":"LOAD_AND_BRUSH"}

[menu __main prep parkpurge]
name: Park Purge
icon: extrude
method: printer.gcode.script
params: {"script":"PARK_PURGE"}

[main]
job_complete_timeout: 3600

[printer v2]
# Define the moonraker host/port if different from 127.0.0.1 and 7125
moonraker_host: 127.0.0.1
moonraker_port: 7125

# Define what items should be shown in titlebar besides the extruder and bed
# the name must be the same as defined in the klipper config
# valid options are temperature_sensors or temperature_fans, or heater_generic
titlebar_items: extruder, heater_bed, chamber

extrude_distances: 5, 10, 20
extrude_speeds: 1, 5, 25, 35
move_distances: 0.1, 0.5, 1, 5, 10, 50, 100

