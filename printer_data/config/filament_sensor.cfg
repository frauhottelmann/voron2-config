[filament_motion_sensor filament_sensor]
switch_pin: PG15
pause_on_runout: True
detection_length: 10
extruder: extruder
runout_gcode: sensor_runout

[gcode_macro sensor_runout]
gcode:
    { action_respond_info("Filament Runout") }

[filament_switch_sensor A4T_Sensor]
pause_on_runout: True
switch_pin: H36_combo:PB1
insert_gcode:
    UPDATE_DELAYED_GCODE ID=AUTO_LOAD_DELAY DURATION=2.0

[gcode_macro AUTO_LOAD_FILAMENT]
gcode:
    {% set min_temp = 250 %}
    {% set load_length = 50 %}
    {% set load_speed = 100 %}

    {% if printer["filament_switch_sensor A4T_Sensor"].filament_detected %}

        {% if printer.extruder.temperature >= min_temp %}

            SAVE_GCODE_STATE NAME=autoload_state

            M83
            G1 E{load_length} F{load_speed}

            RESTORE_GCODE_STATE NAME=autoload_state

            RESPOND MSG="Filament loaded automatically"

        {% else %}
            RESPOND TYPE=error MSG="Hotend has to be at least {min_temp}°C."
        {% endif %}

    {% else %}
        RESPOND MSG="Filament not detected any more."
    {% endif %}

[delayed_gcode AUTO_LOAD_DELAY]
gcode:
    AUTO_LOAD_FILAMENT