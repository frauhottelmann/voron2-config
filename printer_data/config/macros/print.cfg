[gcode_macro START_PRINT]
gcode:

  #Get variables from Slicer GCode
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
  {% set TARGET_CHAMBER = params.CHAMBER_TEMP|default("20")|int %}
  {% set PRESSURE_ADVANCE = params.PRESSURE_ADVANCE|default("0.03")|float %}
  {% set FILAMENT_TYPE = params.FILAMENT_TYPE %}
  {% if FILAMENT_TYPE == 'PLA' %}  
      {% set OFFSET = 0.03|default(0)|float %}
  {% elif FILAMENT_TYPE in ['PET','PETG'] %}     
      {% set OFFSET = 0.05|default(0)|float %}
  {% elif FILAMENT_TYPE in ['ASA','ABS'] %}  
      {% set OFFSET = 0.05|default(0)|float %}
  {% else %}
      {% set OFFSET = 0.03|default(0)|float %}
  {% endif %}
  
  UPDATE_DELAYED_GCODE ID=AIR_SCRUB DURATION=0

  SET_GCODE_OFFSET Z=0  
  BED_MESH_CLEAR
  
  status_heating
  #Conditional heatsoak.
  {% if printer['temperature_sensor chamber'].temperature < TARGET_CHAMBER  %}
        M117 Preheating chamber to {TARGET_CHAMBER}°C.
        CHAMBER_OFF
        HEATSOAK BED_TEMP={BED_TEMP} CHAMBER_TEMP={TARGET_CHAMBER} WAIT=1
  {% endif %}
  
  CHAMBER_ON
  BED_FANS_SLOW

  status_homing
  
  _CG28
  
  CQGL

  #Apply skew profile.
  # SKEW_PROFILE LOAD=CaliFlower

  #Set pressure advance depending on filament.
  SET_PRESSURE_ADVANCE ADVANCE={PRESSURE_ADVANCE}
  CLEAR_PAUSE
  G90

  status_heating
  M117 Heatup bed to {BED_TEMP}°C.

  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}  
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP*0.96} MAXIMUM={BED_TEMP*1.04}

  M117 Adaptive bedmeshing in progress.
  status_meshing
  BED_MESH_CALIBRATE ADAPTIVE=1

  G0 X85 Y306 Z15 F6000

  M117 Heatup nozzle to 160°C for scrub.
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET=160
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={160*0.98} MAXIMUM={160*1.02}

  M117 Nozzle scrub.
  brush_nozzle
  G0 X150 Y150 F8000

  M117 Cool down nozzle to 145°C for touch.
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET=145
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={145*0.98} MAXIMUM={145*1.02}

  M117 Cartographer touch.
  status_calibrating_z
  CARTOGRAPHER_TOUCH_HOME

  SET_GCODE_OFFSET Z_ADJUST={OFFSET} MOVE=1

  G0 X150 Y10 F8000

  M117 Heatup nozzle to {EXTRUDER_TEMP}°C.
  status_heating
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP*0.98} MAXIMUM={EXTRUDER_TEMP*1.02}

  status_printing

  M117 Purging.
  LINE_PURGE
  M117

[gcode_macro END_PRINT]
gcode:

  M117 End print
  END_PRINT_UNLOAD
  TURN_OFF_HEATERS
  BED_FANS_FAST
  UPDATE_DELAYED_GCODE ID=AIR_SCRUB DURATION=300

  status_cooling
  
  PRESENT_PRINT
  M117
  M84 
  BED_MESH_CLEAR
  M117

[gcode_macro PRESENT_PRINT]
gcode:
  SAVE_GCODE_STATE NAME=present_print_state

  {% set X_MAX = printer.toolhead.axis_maximum.x|float %}
  {% set Y_MAX = printer.toolhead.axis_maximum.y|float %}
  {% set Z_MAX = printer.toolhead.axis_maximum.z|float %}
  {% set Z_PARK_MIN = 25 | float %}
  {% set Z_PARK_LIFT = 20 | float %}

  G90
  {% if printer.toolhead.position.z + Z_PARK_LIFT > Z_PARK_MIN %}
    G1 X{X_MAX * 0.9} Y{Y_MAX * 0.9} Z{printer.toolhead.position.z + Z_PARK_LIFT} F4000
  {% else %}
    G1 X{X_MAX *0.9} Y{Y_MAX * 0.9} Z{Z_PARK_MIN} F4000
  {% endif %}

  RESTORE_GCODE_STATE NAME=present_print_state

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}

[gcode_macro HEATSOAK]
gcode:
    # Parameters
    {% set BED_TEMP = params.BED_TEMP|default(100)|int %}
    {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(35)|int %}
    {% set wait = params.WAIT|default(0)|int %}

    SAVE_GCODE_STATE NAME=HEATSOAK
    M104 S0                                                               ; turn off hotend
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}                   ; heat bed
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP*0.96} MAXIMUM={BED_TEMP*1.04}  ; wait for bed temperature
    BED_FANS_FAST                                                         ; turn on bed fans to 100%
    {% if CHAMBER_TEMP > 29 and wait == 1 %}
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={CHAMBER_TEMP} ; wait for chamber temp
    {% endif %}
    M117 Heat soak finished.
    RESTORE_GCODE_STATE NAME=HEATSOAK

[gcode_macro HOT_UNLOAD_FILAMENT]
description: unloads filament at given temperature
gcode:
    {% set TARGET = params.TARGET | default(260) | float %}
    SAVE_GCODE_STATE NAME=HOTUNLOADFILAMENT
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={TARGET}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={TARGET*0.98} MAXIMUM={TARGET*1.02}
    M83                                   ; set extruder to relative
    G1 E30 F600                           ; extrude a little to soften tip 
    G1 E-120 F3500                        ; retract filament completely
    G4 P15000
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    RESTORE_GCODE_STATE NAME=HOTUNLOADFILAMENT

[gcode_macro HOT_LOAD_FILAMENT]
description: unloads filament at given temperature
gcode:
    {% set TARGET = params.TARGET | default(260) | float %}
    SAVE_GCODE_STATE NAME=HOTLOADFILAMENT
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={TARGET}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={TARGET*0.98} MAXIMUM={TARGET*1.02}
    M83 ; set extruder to relative
    G1 E150 F500
    G1 E-20 F3500
    G4 P15000
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    RESTORE_GCODE_STATE NAME=HOTLOADFILAMENT

[gcode_macro UNLOAD_FILAMENT]
gcode:
    SAVE_GCODE_STATE NAME=UNLOADFILAMENT
    M83                                   ; set extruder to relative
    G1 E30 F600                           ; extrude a little to soften tip 
    G1 E-120 F3500                        ; retract filament completely
    RESTORE_GCODE_STATE NAME=UNLOADFILAMENT

[gcode_macro LOAD_FILAMENT]
gcode:
    SAVE_GCODE_STATE NAME=LOADFILAMENT
    M83 ; set extruder to relative
    G1 E150 F500
    G1 E-20 F3500
    RESTORE_GCODE_STATE NAME=LOADFILAMENT

[gcode_macro END_PRINT_UNLOAD]
description: Unloads after a print is finished.
gcode:
    SAVE_GCODE_STATE NAME=UNLOADFILAMENT
    M83
    G1 E-20 F3500 #fast-unload
    RESTORE_GCODE_STATE NAME=UNLOADFILAMENT

[gcode_macro _WAIT]
gcode:
    {% set TIME = params.TIME|default(0)|int %}
    G4 P{TIME*1000}

[gcode_macro _KAMP_Settings]
description: This macro contains all adjustable settings for KAMP 

# The following variables are settings for KAMP as a whole.
variable_verbose_enable: False               # Set to True to enable KAMP information output when running. This is useful for debugging.                                                                                                    # Legacy Gcode:   'M401'         | 'M402'

# The following variables are for adjusting adaptive purge settings for KAMP.
variable_purge_height: 0.8                  # Z position of nozzle during purge, default is 0.8.
variable_tip_distance: 20                   # Distance between tip of filament and nozzle before purge. Should be similar to PRINT_END final retract amount.
variable_purge_margin: 20                   # Distance the purge will be in front of the print area, default is 10.
variable_purge_amount: 30                   # Amount of filament to be purged prior to printing.
variable_flow_rate: 12                      # Flow rate of purge in mm3/s. Default is 12.

# The following variables are for adjusting the Smart Park feature for KAMP, which will park the printhead near the print area at a specified height.
variable_smart_park_height: 10              # Z position for Smart Park, default is 10.

gcode: # Gcode section left intentionally blank. Do not disturb.

    {action_respond_info(" Running the KAMP_Settings macro does nothing, it is only used for storing KAMP settings. ")}

[gcode_macro LINE_PURGE]
description: A purge macro that adapts to be near your actual printed objects
gcode:
    # Get relevant printer params
    {% set travel_speed = (printer.toolhead.max_velocity) * 50 | float %}
    {% set cross_section = printer.configfile.settings.extruder.max_extrude_cross_section | float %}
    
    # Use firmware retraction if it is defined
    {% if printer.firmware_retraction is defined %}
        {% set RETRACT = G10 | string %}
        {% set UNRETRACT = G11 | string %}
    {% else %}
        {% set RETRACT = 'G1 E-.5 F2100' | string %}
        {% set UNRETRACT = 'G1 E.5 F2100' | string %}
    {% endif %}

    # Get purge settings from _Kamp_Settings
    {% set verbose_enable = printer["gcode_macro _KAMP_Settings"].verbose_enable | abs %}
    {% set purge_height = printer["gcode_macro _KAMP_Settings"].purge_height | float %}
    {% set tip_distance = printer["gcode_macro _KAMP_Settings"].tip_distance | float %}
    {% set purge_margin = printer["gcode_macro _KAMP_Settings"].purge_margin | float %}
    {% set purge_amount = printer["gcode_macro _KAMP_Settings"].purge_amount | float %}
    {% set flow_rate = printer["gcode_macro _KAMP_Settings"].flow_rate | float %}


    # Calculate purge origins and centers from objects
    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}    # Get all object points
    {% set purge_x_min = (all_points | map(attribute=0) | min | default(0)) %}                          # Object x min
    {% set purge_x_max = (all_points | map(attribute=0) | max | default(0)) %}                          # Object x max
    {% set purge_y_min = (all_points | map(attribute=1) | min | default(0)) %}                          # Object y min
    {% set purge_y_max = (all_points | map(attribute=1) | max | default(0)) %}                          # Object y max

    {% set purge_x_center = ([((purge_x_max + purge_x_min) / 2) - (purge_amount / 2), 0] | max) %}      # Create center point of purge line relative to print on X axis
    {% set purge_y_center = ([((purge_y_max + purge_y_min) / 2) - (purge_amount / 2), 0] | max) %}      # Create center point of purge line relative to print on Y axis

    {% set purge_x_origin = ([purge_x_min - purge_margin, 0] | max) %}                                  # Add margin to x min, compare to 0, and choose the larger
    {% set purge_y_origin = ([purge_y_min - purge_margin, 0] | max) %}                                  # Add margin to y min, compare to 0, and choose the larger

    # Calculate purge speed
    {% set purge_move_speed = (flow_rate / 5.0) * 60 | float %}

    {% if cross_section < 5 %}

        {action_respond_info("[Extruder] max_extrude_cross_section is insufficient for purge, please set it to 5 or greater. Purge skipped.")}

    {% else %}

        {% if verbose_enable == True %}

        {action_respond_info("Moving filament tip {}mms".format(                                                                 
            (tip_distance),                                                                                      
        )) }
        {% endif %}

        {% if printer.firmware_retraction is defined %}
            {action_respond_info("KAMP purge is using firmware retraction.")}
        {% else %}
            {action_respond_info("KAMP purge is not using firmware retraction, it is recommended to configure it.")}
        {% endif %}

        {% if purge_y_origin > 0 %}
        
            {action_respond_info("KAMP purge starting at {}, {} and purging {}mm of filament, requested flow rate is {}mm3/s.".format(                                                                 
                (purge_x_center),
                (purge_y_origin),
                (purge_amount),
                (flow_rate),
            )) }
    
        {% else %}
    
            {action_respond_info("KAMP purge starting at {}, {} and purging {}mm of filament, requested flow rate is {}mm3/s.".format(                                                                 
                (purge_x_origin),
                (purge_y_center),
                (purge_amount),
                (flow_rate),
            )) }

        {% endif %}

        SAVE_GCODE_STATE NAME=Prepurge_State                                                    # Create gcode state

        {% if purge_y_origin > 0 %}                                                             # If there's room on Y, purge along X axis in front of print area

            G92 E0                                                                              # Reset extruder
            G0 F{travel_speed}                                                                  # Set travel speed
            G90                                                                                 # Absolute positioning
            G0 X{purge_x_center} Y{purge_y_origin}                                              # Move to purge position
            G0 Z{purge_height}                                                                  # Move to purge Z height
            M83                                                                                 # Relative extrusion mode
            G1 E{tip_distance} F{purge_move_speed}                                              # Move filament tip
            G1 X{purge_x_center + purge_amount} E{purge_amount} F{purge_move_speed}             # Purge line
            {RETRACT}                                                                           # Retract
            G0 X{purge_x_center + purge_amount + 10} F{travel_speed}                            # Rapid move to break string
            G92 E0                                                                              # Reset extruder distance
            M82                                                                                 # Absolute extrusion mode
            G0 Z{purge_height * 2} F{travel_speed}                                              # Z hop

        {% else %}                                                                              # If there's room on X, purge along Y axis to the left of print area
            
            G92 E0                                                                              # Reset extruder
            G0 F{travel_speed}                                                                  # Set travel speed
            G90                                                                                 # Absolute positioning
            G0 X{purge_x_origin} Y{purge_y_center}                                              # Move to purge position
            G0 Z{purge_height}                                                                  # Move to purge Z height
            M83                                                                                 # Relative extrusion mode
            G1 E{tip_distance} F{purge_move_speed}                                              # Move filament tip
            G1 Y{purge_y_center + purge_amount} E{purge_amount} F{purge_move_speed}             # Purge line
            {RETRACT}                                                                           # Retract
            G0 Y{purge_y_center + purge_amount + 10} F{travel_speed}                            # Rapid move to break string
            G92 E0                                                                              # Reset extruder distance
            M82                                                                                 # Absolute extrusion mode
            G0 Z{purge_height * 2} F{travel_speed}                                              # Z hop

        {% endif %}

        RESTORE_GCODE_STATE NAME=Prepurge_State                                                 # Restore gcode state
    
    {% endif %}