#####################################
#           INCLUDES                #
#####################################

[include mainsail.cfg]
[include H36.cfg]
[include leds.cfg]
[include macros/macros.cfg]
[include shell_command.cfg]
# [include sfs.conf]
[include cartographer.cfg]

#####################################
#           BASICS                  #
#####################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_440057000251313133353932-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 500  
max_accel: 2500
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

[exclude_object]

[force_move]
enable_force_move: True


#####################################################################
#   Extruder
#####################################################################

[extruder]
step_pin: H36_combo:PB9 
dir_pin: H36_combo:PB8
enable_pin: !H36_combo:PB7
rotation_distance: 22.6789511   #Bondtech 5mm Drive Gears
gear_ratio: 50:10
microsteps: 32
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: H36_combo: PA7 
pullup_resistor: 2200
sensor_type: Generic 3950
sensor_pin: H36_combo:PA6 
min_temp: 0
max_temp: 270
max_power: 1.0
min_extrude_temp: 170
#control: pid
#pid_kp: 26.213
#pid_ki: 1.304
#pid_kd: 131.721

[safe_z_home]
home_xy_position: 150, 150
speed: 50.0
z_hop: 10
z_hop_speed: 15.0

[tmc2209 extruder]
uart_pin: H36_combo:PC14
interpolate: false
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 80
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: true
run_current: 1.4
diag_pin: ^PG6

[autotune_tmc stepper_x]
motor: moons-ms17hd6p420I-05
sg4_thrs: 150

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 312
position_max: 312
homing_speed: 80
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: true
run_current: 1.4
diag_pin: ^PG9

[autotune_tmc stepper_y]
motor: moons-ms17hd6p420I-05
sg4_thrs: 165
 
#####################################################################
#   Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
position_max: 260
position_min: -5
homing_speed: 8
second_homing_speed: 3
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: true
run_current: 1.4

[autotune_tmc stepper_z]
motor: moons-ms17hd6p420I-05

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 1.4

[autotune_tmc stepper_z1]
motor: moons-ms17hd6p420I-05

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: true
run_current: 1.4

[autotune_tmc stepper_z2]
motor: moons-ms17hd6p420I-05

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: true
run_current: 1.4

[autotune_tmc stepper_z3]
motor: moons-ms17hd6p420I-05


#####################################################################
#   Bed Heater
#####################################################################

##  SSR Pin - HE1
##  Thermistor - TB
[heater_bed]
##  Uncomment the following line if using the default SSR wiring from the docs site
heater_pin: PA3
##  Other wiring guides may use BED_OUT to control the SSR. Uncomment the following line for those cases
#heater_pin: PA1
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
sensor_type: Generic 3950
sensor_pin: PF3
##  Adjust max_power so it doesn't exceed the SSR rating. The Omron G3NA-210B-DC5 SSR is rated at 4 amps without a heatsink.
##  The formula is "4 / (Wattage_of_bed_heater / Mains_voltage) = max_power"
##  If max_power is greater than 1.0, use 1.0
max_power: 1.0
min_temp: -200
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

#####################################################################
#   Temperatures
#####################################################################

[temperature_sensor Octopus]
sensor_type              : temperature_mcu
sensor_mcu               : mcu

[temperature_sensor RPI4]
sensor_type: temperature_host

[temperature_sensor chamber]
sensor_pin: PF4
sensor_type: Generic 3950
min_temp: 0
max_temp: 130

#####################################################################
#   Fan Control
#####################################################################


[temperature_fan electronics_compartment]
pin: PA8
sensor_type: temperature_host
kick_start_time: 0.75
max_power: 1
shutdown_speed: 1
off_below: 0.5
max_speed: 0.7
min_speed: 0
min_temp: 10
max_temp: 90
target_temp: 50
control: pid
pid_Kp: 2
pid_Ki: 4
pid_Kd: 0.1

[temperature_fan electronics_compartment_2]
pin: PE5
sensor_type: temperature_host
kick_start_time: 0.75
max_power: 1
shutdown_speed: 1
off_below: 0.5
max_speed: 0.7
min_speed: 0
min_temp: 10
max_temp: 90
target_temp: 50
control: pid
pid_Kp: 2
pid_Ki: 4
pid_Kd: 0.1

[controller_fan steppers]
pin: PD12
fan_speed: 0.75
idle_timeout: 30
idle_speed: 0.2
stepper: stepper_x,stepper_y,stepper_z

[fan_generic the_filter]
pin: PB10

#####################################################################
#   LED Control
#####################################################################

## Chamber Lighting - HE2 Connector (Optional)
#[output_pin caselight]
##Octopus 1.0 & 1.1, Octopus PRO 1.0
#pin: PB10
##Octopus PRO 1.1
#pin: PB0
#pwm:true
#shutdown_value: 0
#value:1
#cycle_time: 0.01

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

[quad_gantry_level]

gantry_corners:
  -60,-10
  360,370
#  Probe points
points:
  50,25
  50,225
  250,225
  250,25

speed: 200
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.015
max_adjust: 10

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>

